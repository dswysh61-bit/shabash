<!doctype html>
<html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>גיוון תנועות</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Secular+One&family=IBM+Plex+Sans+Hebrew:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: a duty-desk console — the day's instruction as two big signal panels, then balance, then the log */
:root{
  --bg:#e9edf2; --panel:#ffffff; --panel-2:#f4f6f9; --fg:#121a24; --muted:#5a6779; --line:#d3dae3;
  --accent:#16336b; --accent-fg:#ffffff; --wa:#128c4a; --wa-bubble:#dcf6e4; --warn:#8a5300;
  --r-red:#d7383d; --r-blue:#2a6fe0; --r-green:#1c9258; --r-yellow:#e0a800; --r-white:#8f9bab;
  --shadow:0 1px 2px rgba(18,26,36,.06),0 8px 24px -12px rgba(18,26,36,.18);
  --f-display:"Secular One","IBM Plex Sans Hebrew",Arial,sans-serif;
  --f-body:"IBM Plex Sans Hebrew",Arial,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0b1119; --panel:#141c27; --panel-2:#1a2431; --fg:#e9eef5; --muted:#93a1b4; --line:#263243;
  --accent:#6f9cff; --accent-fg:#081120; --wa:#25b865; --wa-bubble:#103a26; --warn:#f2b347;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px -12px rgba(0,0,0,.6); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0b1119; --panel:#141c27; --panel-2:#1a2431; --fg:#e9eef5; --muted:#93a1b4; --line:#263243;
  --accent:#6f9cff; --accent-fg:#081120; --wa:#25b865; --wa-bubble:#103a26; --warn:#f2b347;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px -12px rgba(0,0,0,.6); color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.5;direction:rtl}
.wrap{max-width:900px;margin:0 auto;padding-block:22px 56px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:18px}

/* header */
.top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px}
.brand{display:flex;align-items:center;gap:12px}
.mark{width:42px;height:42px;border-radius:12px;display:grid;grid-template-columns:1fr 1fr;gap:3px;padding:7px;background:var(--panel);box-shadow:var(--shadow)}
.mark i{border-radius:3px}
h1{font-family:var(--f-display);font-weight:400;font-size:28px;line-height:1.1;margin:0;letter-spacing:.2px}
.sub{color:var(--muted);font-size:13px}
.tag{font-size:12px;font-weight:600;color:var(--warn);border:1px solid currentColor;border-radius:999px;padding:3px 10px}

.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:20px;display:flex;flex-direction:column;gap:16px;min-width:0}
.card-h{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px}
h2{font-family:var(--f-display);font-weight:400;font-size:20px;margin:0}
.eyebrow{font-size:12px;font-weight:600;letter-spacing:.06em;color:var(--muted)}

/* controls */
input[type=date]{font:inherit;font-family:var(--f-mono);color:var(--fg);background:var(--panel-2);border:1px solid var(--line);border-radius:10px;padding:9px 12px}
.btn{font:inherit;font-weight:600;border:1px solid var(--line);background:var(--panel-2);color:var(--fg);border-radius:10px;padding:10px 16px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:transform .08s,filter .15s}
.btn:hover{filter:brightness(1.05)}.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.btn.wa{background:var(--wa);border-color:var(--wa);color:#fff}
.btn.sm{padding:6px 11px;font-size:13px;border-radius:8px}
.btn.big{padding:13px 20px;font-size:16px}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* signal panels */
.signals{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px}
.signal{border:1px solid var(--line);border-radius:14px;overflow:hidden;display:flex;flex-direction:column;min-width:0;background:var(--panel-2)}
.signal-face{--c:var(--r-white);background:var(--c);color:#fff;padding:16px 18px;display:flex;align-items:flex-end;justify-content:space-between;gap:8px;min-height:104px;position:relative}
.signal-face::after{content:"";position:absolute;inset:0;background:linear-gradient(160deg,rgba(255,255,255,.18),rgba(0,0,0,.12));pointer-events:none}
.signal-face .dir{font-size:13px;font-weight:600;opacity:.9;position:relative}
.signal-face .val{font-family:var(--f-display);font-size:30px;line-height:1;position:relative;text-shadow:0 1px 2px rgba(0,0,0,.2)}
.signal-face .en{font-family:var(--f-mono);font-size:12px;opacity:.85;position:relative}
.signal-face.dark-text{color:#1b1400}
.picker{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;padding:10px}
.chip{position:relative}
.chip input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer}
.chip span{display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 2px 6px;border-radius:10px;border:2px solid transparent;font-size:12px;font-weight:600;color:var(--muted);cursor:pointer;text-align:center}
.chip .sw{width:26px;height:26px;border-radius:50%;background:var(--c);box-shadow:inset 0 0 0 2px rgba(255,255,255,.35)}
.chip .p{font-family:var(--f-mono);font-size:11px;min-height:15px;color:var(--fg);font-variant-numeric:tabular-nums}
.chip .pb{width:80%;height:4px;border-radius:2px;background:var(--line);overflow:hidden}
.chip .pb i{display:block;height:100%;background:var(--c)}
.chip input:checked + span{border-color:var(--c);background:var(--panel);color:var(--fg)}
.chip input:focus-visible + span{outline:2px solid var(--accent);outline-offset:1px}
.chip.blocked span{opacity:.45}
.why{font-size:12px;color:var(--muted);padding:0 12px 12px;min-height:30px}

.actions{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.hint{font-size:13px;color:var(--muted)}

/* whatsapp bubble */
.bubble-wrap{display:flex;flex-direction:column;gap:10px}
.bubble{background:var(--wa-bubble);border-radius:14px 14px 4px 14px;padding:14px 16px;max-width:520px;white-space:pre-wrap;line-height:1.65;unicode-bidi:plaintext;font-size:14.5px;position:relative}
.bubble b{font-weight:700}

/* stats */
.tabs{display:inline-flex;background:var(--panel-2);border:1px solid var(--line);border-radius:10px;padding:3px;gap:2px}
.tabs button{font:inherit;font-size:13px;font-weight:600;border:0;background:none;color:var(--muted);padding:6px 12px;border-radius:7px;cursor:pointer}
.tabs button[aria-pressed="true"]{background:var(--panel);color:var(--fg);box-shadow:var(--shadow)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px}
.stat{border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:14px;min-width:0;background:var(--panel-2)}
.stat-h{display:flex;align-items:center;gap:14px}
.ring{width:72px;height:72px;flex:none}
.ring text{font-family:var(--f-mono);font-weight:600;fill:var(--fg)}
.stack{display:flex;height:12px;border-radius:6px;overflow:hidden;background:var(--line)}
.stack i{display:block;height:100%}
.legend{display:grid;grid-template-columns:1fr auto auto;gap:6px 12px;font-size:14px;align-items:center}
.legend .n{font-family:var(--f-mono);font-variant-numeric:tabular-nums;text-align:left}
.legend .pc{font-family:var(--f-mono);font-variant-numeric:tabular-nums;color:var(--muted);text-align:left;min-width:42px}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-inline-end:8px;vertical-align:middle}

/* log */
.log{display:flex;flex-direction:column}
.entry{display:grid;grid-template-columns:auto 1fr auto;gap:8px 14px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.entry:last-child{border-bottom:0}
.entry .d{font-family:var(--f-mono);font-variant-numeric:tabular-nums;font-size:14px}
.entry .wd{display:block;font-family:var(--f-body);font-size:11px;color:var(--muted)}
.pills{display:flex;flex-wrap:wrap;gap:6px}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:13px;padding:3px 10px 3px 8px;border-radius:999px;background:var(--panel-2);border:1px solid var(--line)}
.pill small{color:var(--muted);font-size:11px}
.acts{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.entry .bubble{grid-column:1/-1;max-width:none}
.empty{color:var(--muted);text-align:center;padding:24px 0}
.demo{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;border:1px dashed var(--warn);color:var(--warn);border-radius:12px;padding:10px 14px;font-size:14px}
@media (max-width:560px){
  .entry{grid-template-columns:1fr}
  .acts{justify-content:flex-start}
  .picker{gap:3px;padding:8px}
  .signal-face .val{font-size:26px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div class="wrap">
  <header class="top">
    <div class="brand">
      <div class="mark" aria-hidden="true"><i style="background:var(--r-red)"></i><i style="background:var(--r-blue)"></i><i style="background:var(--r-green)"></i><i style="background:var(--r-yellow)"></i></div>
      <div><h1>גיוון תנועות</h1><div class="sub">צוות הביטחון · הנחיות הגעה ויציאה</div></div>
    </div>
    <span class="tag">דמו · לא להזין נתונים מבצעיים</span>
  </header>

  <div id="demoBox" class="demo" hidden>
    <span>מוצגים נתוני דוגמה של 25 ימים. בשמירה הראשונה הם יימחקו.</span>
    <button id="clearDemo" type="button" class="btn sm">התחל נקי</button>
  </div>

  <form id="planForm" class="card" aria-labelledby="h-plan">
    <div class="card-h">
      <div><div class="eyebrow">הנחיה יומית</div><h2 id="h-plan">ליום <span id="dayTitle"></span></h2></div>
      <input type="date" id="day" required aria-label="תאריך">
    </div>
    <div class="signals">
      <div class="signal"><div class="signal-face" id="face-arrival"></div><div class="picker" id="pick-arrival" role="radiogroup" aria-label="צבע הגעה"></div><div class="why" id="why-arrival"></div></div>
      <div class="signal"><div class="signal-face" id="face-departure"></div><div class="picker" id="pick-departure" role="radiogroup" aria-label="צבע יציאה"></div><div class="why" id="why-departure"></div></div>
    </div>
    <div class="actions">
      <button type="button" id="suggestBtn" class="btn big">🎲 הגרל צבעים</button>
      <button type="submit" class="btn big primary">שמור הנחיה</button>
      <span class="hint" id="hint">ההגרלה מעדיפה צבעים שהשתמשו בהם פחות או מזמן. צבע מאתמול חסום, והיציאה שונה מההגעה.</span>
    </div>
    <div id="savedBox" class="bubble-wrap" hidden></div>
  </form>

  <section class="card" aria-labelledby="h-stats">
    <div class="card-h">
      <div><div class="eyebrow">איזון</div><h2 id="h-stats">סטטיסטיקות</h2></div>
      <div class="tabs" id="tabs"></div>
    </div>
    <div class="stats" id="stats"></div>
    <div class="hint" id="statsNote"></div>
  </section>

  <section class="card" aria-labelledby="h-log">
    <div class="card-h"><div><div class="eyebrow">היסטוריה</div><h2 id="h-log">יומן הנחיות</h2></div></div>
    <div class="log" id="log"></div>
  </section>
</div>

<script>
const WINDOW_DAYS = 28, NO_REPEAT_DAYS = 1, MIN_WEIGHT = 0.15;
const COLORS = {
  red:   {he:'אדום', em:'🔴', en:'Red',         v:'--r-red'},
  blue:  {he:'כחול', em:'🔵', en:'Blue',        v:'--r-blue'},
  green: {he:'ירוק', em:'🟢', en:'Green',       v:'--r-green'},
  yellow:{he:'צהוב', em:'🟡', en:'Yellow',      v:'--r-yellow'},
  white: {he:'חופשי', em:'⚪', en:'Free choice', v:'--r-white', full:'בחירה חופשית'}
};
const heName = k => COLORS[k].full || COLORS[k].he;
const ROUTES = ['red','blue','green','yellow'];
const DIRS = {arrival:'הגעה', departure:'יציאה'};
const KEY = 'movement-plans-v1';
const WD = ['ראשון','שני','שלישי','רביעי','חמישי','שישי','שבת'];
const $ = id => document.getElementById(id);

/* ---- dates ---- */
const pad = n => String(n).padStart(2,'0');
const todayISO = () => { const d = new Date(); return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; };
const addDays = (iso, n) => { const d = new Date(iso+'T00:00:00Z'); d.setUTCDate(d.getUTCDate()+n); return d.toISOString().slice(0,10); };
const diffDays = (a, b) => Math.round((new Date(a+'T00:00:00Z') - new Date(b+'T00:00:00Z')) / 864e5);
const fmt = iso => { const [y,m,d] = iso.split('-'); return `${d}/${m}/${y}`; };
const weekday = iso => 'יום ' + WD[new Date(iso+'T00:00:00Z').getUTCDay()];

/* ---- storage ---- */
let plans = {}, isDemo = false;
function load(){
  try { const s = localStorage.getItem(KEY); if (s) { plans = JSON.parse(s) || {}; return; } } catch(e){}
  isDemo = true; plans = {};
  const pool = ['red','red','red','blue','green','yellow','white'];
  let seed = 7; const rnd = () => (seed = (seed*9301+49297)%233280)/233280;
  for (let i=1;i<=25;i++){
    const a = pool[Math.floor(rnd()*pool.length)];
    let d; do { d = pool[Math.floor(rnd()*pool.length)]; } while (d===a);
    plans[addDays(todayISO(), -i)] = {arrival:a, departure:d};
  }
}
function save(){ try { localStorage.setItem(KEY, JSON.stringify(plans)); } catch(e){} }

/* ---- secure random ---- */
function rand(){ const a = new Uint32Array(1); crypto.getRandomValues(a); return a[0] / 4294967296; }
function weightedPick(weights){
  const keys = Object.keys(weights), tot = keys.reduce((s,k)=>s+weights[k],0);
  let r = rand()*tot;
  for (const k of keys){ r -= weights[k]; if (r < 0) return k; }
  return keys.filter(k=>weights[k]>0).pop();
}

/* ---- the algorithm: random but calculated ---- */
function suggestFor(target, dir, exclude){
  const start = addDays(target, -WINDOW_DAYS);
  const rows = Object.entries(plans).filter(([d]) => d >= start && d < target).sort(([a],[b]) => a<b?-1:1);
  const used = rows.map(([,p]) => p[dir]).filter(c => ROUTES.includes(c));
  const n = used.length, expected = n ? n/ROUTES.length : 0;
  const lastSeen = {}; rows.forEach(([d,p]) => { if (ROUTES.includes(p[dir])) lastSeen[p[dir]] = d; });
  const blockFrom = addDays(target, -NO_REPEAT_DAYS);
  const blocked = new Set(rows.filter(([d]) => d >= blockFrom).map(([,p]) => p[dir]));
  const weights = {}, why = {};
  for (const k of ROUTES){
    const cnt = used.filter(c=>c===k).length;
    const balance = expected ? 1 + (expected - cnt)/expected : 1;          // less used → higher
    const gap = lastSeen[k] ? diffDays(target, lastSeen[k]) : WINDOW_DAYS;
    const recency = 1 + Math.min(gap, 7)/7;                                // longer ago → higher
    let w = Math.max(MIN_WEIGHT, balance) * recency;
    let note = `${cnt} פעמים ב-${WINDOW_DAYS} יום, אחרון לפני ${gap} ימים`;
    if (blocked.has(k)) { w = 0; note = 'חסום: שומש אתמול'; }
    if (k === exclude)  { w = 0; note = 'חסום: זהה להגעה'; }
    weights[k] = w; why[k] = note;
  }
  if (!Object.values(weights).some(Boolean)) ROUTES.forEach(k => { if (k!==exclude) weights[k] = 1; });
  const tot = Object.values(weights).reduce((a,b)=>a+b,0);
  const probs = {}; ROUTES.forEach(k => probs[k] = Math.round(100*weights[k]/tot));
  return {pick: weightedPick(weights), probs, why};
}

/* ---- message ---- */
function waText(day, a, d){
  return `*הנחיות תנועה | Movement Instructions*\n${fmt(day)}\n\n*עברית*\nהגעה: ${COLORS[a].em} ${heName(a)}\nיציאה: ${COLORS[d].em} ${heName(d)}\nיש לפעול בהתאם להנחיות צוות הביטחון.\n\n*English*\nArrival: ${COLORS[a].em} ${COLORS[a].en}\nDeparture: ${COLORS[d].em} ${COLORS[d].en}\nPlease follow the Security Team's instructions.\n\n*צוות הביטחון | Security Team*`;
}
const waLink = t => 'https://wa.me/?text=' + encodeURIComponent(t);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const bubbleHTML = t => esc(t).replace(/\*([^*\n]+)\*/g, '<b>$1</b>');   // WhatsApp-style bold
async function copy(text, btn){
  const old = btn.textContent;
  try { await navigator.clipboard.writeText(text); btn.textContent = 'הועתק ✓'; }
  catch(e){ btn.textContent = 'סמן והעתק ידנית'; }
  setTimeout(()=>btn.textContent=old, 1600);
}
const dot = k => `<span class="dot" style="background:var(${COLORS[k].v})"></span>`;

/* ---- signal panels ---- */
function buildPicker(dir){
  $('pick-'+dir).innerHTML = Object.keys(COLORS).map(k => `
    <label class="chip" style="--c:var(${COLORS[k].v})" data-k="${k}">
      <input type="radio" name="${dir}" value="${k}" id="${dir}-${k}" ${k==='red'?'checked':''}>
      <span><i class="sw"></i>${COLORS[k].he}<em class="p" data-p></em><i class="pb"><i data-b style="width:0"></i></i></span>
    </label>`).join('');
  $('pick-'+dir).addEventListener('change', () => { paintFace(dir); });
}
const val = dir => (document.querySelector(`input[name=${dir}]:checked`)||{}).value;
function setVal(dir, k){ const r = $(`${dir}-${k}`); if (r) r.checked = true; paintFace(dir); }
function paintFace(dir){
  const k = val(dir), f = $('face-'+dir);
  f.style.setProperty('--c', `var(${COLORS[k].v})`);
  f.classList.toggle('dark-text', k==='yellow');
  f.innerHTML = `<div><div class="dir">${DIRS[dir]}</div><div class="val">${heName(k)}</div></div><div class="en">${COLORS[k].en}</div>`;
}
function showProbs(dir, r){
  $('pick-'+dir).querySelectorAll('.chip').forEach(ch => {
    const k = ch.dataset.k, has = r && k in r.probs;
    ch.querySelector('[data-p]').textContent = has ? r.probs[k]+'%' : '';
    ch.querySelector('[data-b]').style.width = has ? r.probs[k]+'%' : '0';
    ch.classList.toggle('blocked', !!(has && r.probs[k]===0));
  });
  $('why-'+dir).textContent = r ? `נבחר ${heName(r.pick)}: ${r.why[r.pick]}` : '';
}
function clearProbs(){ showProbs('arrival', null); showProbs('departure', null); }

buildPicker('arrival'); buildPicker('departure');
$('day').value = addDays(todayISO(), 1);
const syncTitle = () => { $('dayTitle').textContent = $('day').value ? `${WD[new Date($('day').value+'T00:00:00Z').getUTCDay()]}, ${fmt($('day').value)}` : ''; };
$('day').addEventListener('change', () => { syncTitle(); clearProbs(); });
syncTitle(); setVal('arrival','red'); setVal('departure','blue');

$('suggestBtn').onclick = () => {
  const day = $('day').value; if (!day) { $('day').focus(); return; }
  const A = suggestFor(day, 'arrival');
  const D = suggestFor(day, 'departure', A.pick);
  setVal('arrival', A.pick); setVal('departure', D.pick);
  showProbs('arrival', A); showProbs('departure', D);
  $('savedBox').hidden = true;
};

$('planForm').onsubmit = e => {
  e.preventDefault();
  const day = $('day').value; if (!day) return;
  if (isDemo) { plans = {}; isDemo = false; }
  const a = val('arrival'), d = val('departure');
  plans[day] = {arrival:a, departure:d}; save();
  const text = waText(day, a, d);
  $('savedBox').innerHTML = `<div class="eyebrow">נשמר · תדריך מוכן לשליחה</div><div class="bubble">${bubbleHTML(text)}</div>
    <div class="actions"><a class="btn wa" href="${esc(waLink(text))}" target="_blank" rel="noopener">שלח ב-WhatsApp</a><button type="button" class="btn" id="copySaved">העתק</button></div>`;
  $('copySaved').onclick = ev => copy(text, ev.currentTarget);
  $('savedBox').hidden = false; clearProbs();
  render();
};
$('clearDemo').onclick = () => { plans = {}; isDemo = false; save(); render(); };

/* ---- stats ---- */
let period = '30';
const PERIODS = [['7','7 ימים'],['30','30 ימים'],['90','90 ימים'],['all','הכול']];
function ring(score){
  const r = 30, c = 2*Math.PI*r, v = score===null ? 0 : score/100;
  const col = score===null ? 'var(--line)' : score>=75 ? 'var(--r-green)' : score>=50 ? 'var(--r-yellow)' : 'var(--r-red)';
  return `<svg class="ring" viewBox="0 0 72 72" role="img" aria-label="ציון איזון ${score ?? 'אין'}">
    <circle cx="36" cy="36" r="${r}" fill="none" stroke="var(--line)" stroke-width="7"/>
    <circle cx="36" cy="36" r="${r}" fill="none" stroke="${col}" stroke-width="7" stroke-linecap="round"
      stroke-dasharray="${(c*v).toFixed(1)} ${c.toFixed(1)}" transform="rotate(-90 36 36)"/>
    <text x="36" y="41" text-anchor="middle" font-size="17">${score===null?'—':score}</text></svg>`;
}
function renderStats(){
  $('tabs').innerHTML = PERIODS.map(([k,t]) => `<button type="button" data-p="${k}" aria-pressed="${k===period}">${t}</button>`).join('');
  $('tabs').querySelectorAll('button').forEach(b => b.onclick = () => { period = b.dataset.p; renderStats(); });
  const from = period==='all' ? '' : addDays(todayISO(), -Number(period));
  const rows = Object.entries(plans).filter(([d]) => d >= from).map(([,p]) => p);
  $('stats').innerHTML = Object.entries(DIRS).map(([dir, name]) => {
    const counts = {}; Object.keys(COLORS).forEach(k => counts[k] = rows.filter(p => p[dir]===k).length);
    const n = ROUTES.reduce((s,k)=>s+counts[k],0), all = rows.length;
    const pr = k => n ? 100*counts[k]/n : 0;
    const score = n ? Math.round(100*(1 - ROUTES.reduce((s,k)=>s+Math.abs(pr(k)/100-.25),0)/1.5)) : null;
    const sh = k => all ? 100*counts[k]/all : 0;
    return `<div class="stat">
      <div class="stat-h">${ring(score)}<div><div class="eyebrow">${name}</div><div style="font-weight:600">ציון איזון</div><div class="hint">${all} ימים · יעד 25% לכל צבע</div></div></div>
      <div class="stack">${Object.keys(COLORS).map(k => `<i style="width:${sh(k)}%;background:var(${COLORS[k].v})" title="${heName(k)} ${counts[k]}"></i>`).join('')}</div>
      <div class="legend">${Object.keys(COLORS).map(k => `<span>${dot(k)}${heName(k)}</span><span class="n">${counts[k]}</span><span class="pc">${k==='white'? sh(k).toFixed(0) : pr(k).toFixed(0)}%</span>`).join('')}</div>
    </div>`;
  }).join('');
  $('statsNote').textContent = 'אחוזי הצבעים מחושבים מתוך הימים עם צבע קבוע. ציון 100 = חלוקה שווה לגמרי, מתחת ל-50 = יש צבע שחוזר יותר מדי.';
}

/* ---- log ---- */
function renderLog(){
  const days = Object.keys(plans).sort().reverse().slice(0, 60);
  if (!days.length){ $('log').innerHTML = '<p class="empty">עוד אין הנחיות. בחר תאריך, לחץ "הגרל צבעים" ואז "שמור הנחיה".</p>'; return; }
  $('log').innerHTML = days.map(d => { const p = plans[d]; return `<div class="entry">
    <span class="d">${fmt(d)}<span class="wd">${weekday(d)}</span></span>
    <span class="pills"><span class="pill">${dot(p.arrival)}<small>הגעה</small>${heName(p.arrival)}</span><span class="pill">${dot(p.departure)}<small>יציאה</small>${heName(p.departure)}</span></span>
    <span class="acts"><a class="btn sm wa" href="${esc(waLink(waText(d,p.arrival,p.departure)))}" target="_blank" rel="noopener">WhatsApp</a>
      <button type="button" class="btn sm" data-show="${d}" aria-expanded="false">תדריך</button>
      <button type="button" class="btn sm" data-copy="${d}">העתק</button>
      <button type="button" class="btn sm" data-del="${d}">מחק</button></span>
    <div class="bubble" id="msg-${d}" hidden>${bubbleHTML(waText(d,p.arrival,p.departure))}</div></div>`; }).join('');
  $('log').querySelectorAll('[data-show]').forEach(b => b.onclick = () => {
    const m = $('msg-'+b.dataset.show); m.hidden = !m.hidden;
    b.setAttribute('aria-expanded', String(!m.hidden)); b.textContent = m.hidden ? 'תדריך' : 'הסתר';
  });
  $('log').querySelectorAll('[data-copy]').forEach(b => b.onclick = () => { const p = plans[b.dataset.copy]; copy(waText(b.dataset.copy,p.arrival,p.departure), b); });
  $('log').querySelectorAll('[data-del]').forEach(b => b.onclick = () => {
    if (b.dataset.armed){ delete plans[b.dataset.del]; if (!isDemo) save(); render(); }
    else { b.dataset.armed = 1; b.textContent = 'בטוח?'; setTimeout(()=>{ b.textContent='מחק'; delete b.dataset.armed; }, 2500); }
  });
}

function render(){ $('demoBox').hidden = !isDemo; renderStats(); renderLog(); }
load(); render();
</script>
</html>
